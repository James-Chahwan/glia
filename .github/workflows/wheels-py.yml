name: build wheels — glia-py

# Builds abi3 wheels for glia-py (PyPI dist glia-py, import glia_py; the Rust
# pyo3 engine) across the canonical platform matrix: glia_py-<ver>-cp311-abi3-*.whl
# plus an sdist. Triggers on `v*` tag pushes, manual dispatch, and PRs that
# touch a crate the wheel links. Uses maturin's official action. The `release`
# job below publishes to PyPI by OIDC trusted publishing.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}
  pull_request:
    paths:
      - "py/**"
      - "core/**"
      - "code-domain/**"
      - "graph/**"
      - "parsers/**"
      # `engine` (the orchestrator) and `store` (the .gmap writer) were MISSING:
      # a PR touching only those never built a wheel, even though nearly every
      # parser/extractor change lands in one of them. `stamp` carries the build
      # identity the wheel reports.
      - "engine/**"
      - "store/**"
      - "stamp/**"
      # `py` depends on `snapshots` (history_sync, LF.5d): a PR touching only
      # that crate must still build a wheel.
      - "snapshots/**"
      # The wheel also links `activation` (the PPR / plan / algo home, LD.12-LD.15)
      # and `projection-text` (dense_text*). Checked against
      # `cargo tree -p glia-py --edges normal`; `cli`, `doc-sources` and
      # `toy-domain` are NOT linked, so they stay out.
      - "activation/**"
      - "projection-text/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/wheels-py.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: py

# Runner images and actions are pinned (actions by full commit SHA, the version tag
# in a trailing comment): bump them deliberately (0.5.3 EG.5).
jobs:
  linux:
    name: linux ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          working-directory: py
          manylinux: "2_28"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-linux-${{ matrix.target }}
          path: py/dist

  macos:
    name: macos ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Build the Intel (x86_64) wheel by CROSS-COMPILING on the Apple Silicon
          # runner. Dedicated macos-13 (Intel) runners queue for hours / are being
          # retired; abi3 + maturin cross-compiles x86_64-apple-darwin fine on arm64
          # (no target-Python needed), so both mac wheels build on macos-15 (macos-14 is
          # deprecated upstream). The deployment target is pinned so the wheel tags stay
          # 0.5.2's (macosx_10_12_x86_64, macosx_11_0_arm64) whatever the runner's SDK.
          - target: x86_64
            runner: macos-15
            deployment_target: "10.12"
          - target: aarch64
            runner: macos-15
            deployment_target: "11.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          working-directory: py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-macos-${{ matrix.target }}
          path: py/dist

  windows:
    name: windows x86_64
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: x86_64
          args: --release --out dist
          working-directory: py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-windows-x86_64
          path: py/dist

  sdist:
    name: sdist
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
          working-directory: py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-sdist
          path: py/dist

  # Publishes the full wheel matrix + sdist to PyPI.
  #
  # Triggers:
  #   - on a `v*` tag push        → normal release of the version in py/pyproject.toml
  #   - on manual workflow_dispatch → backfill missing-platform wheels for the
  #     current version (skip-existing leaves already-uploaded files untouched)
  #
  # Auth: PyPI OIDC trusted publishing — NO stored secret. The project is
  # glia-py (0.4.x shipped under the old repo-graph dist, which this job no
  # longer publishes). glia-py does not exist on PyPI before its first
  # upload, so the one-time setup is a PENDING publisher, added BEFORE the
  # v0.5.0 tag (without it this job fails) on
  # https://pypi.org/manage/account/publishing/ :
  #   PyPI project name: glia-py
  #   Publisher: GitHub Actions
  #   Owner: James-Chahwan   Repository: glia
  #   Workflow: wheels-py.yml   Environment: (leave blank)
  # After the first upload it is managed at
  # https://pypi.org/manage/project/glia-py/settings/publishing/
  release:
    name: publish
    runs-on: ubuntu-24.04
    needs: [linux, macos, windows, sdist]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      id-token: write    # required for PyPI OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3 (release/v1)
        with:
          packages-dir: dist
          skip-existing: true
