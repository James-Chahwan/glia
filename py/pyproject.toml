[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "glia-py"
version = "0.5.5"
description = "glia, the Rust cross-language code-graph engine (pyo3): parses, builds, and stores code graphs. The engine behind mcp-repo-graph."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    {name = "James Chahwan"},
]
keywords = ["mcp", "llm", "codebase", "graph", "rust", "pyo3"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/James-Chahwan/glia"
Repository = "https://github.com/James-Chahwan/glia"
Issues = "https://github.com/James-Chahwan/glia/issues"

[tool.maturin]
# Must equal py/Cargo.toml's [lib] name and the #[pymodule] fn in py/src/lib.rs
# (pyo3 exports PyInit_<name>); the three move together.
module-name = "glia_py"
# `embed` (ruling FB-3, FB.14): bge-small in every wheel, the extension linking ONNX
# Runtime's CPU provider only; on x86_64 macOS glia-embed builds no ORT at all and
# bge-small refuses (INTEL-MAC-NO-EMBED). The GPU session runs in glia-embed's
# `glia-embed-worker`, which the wheels workflow builds with `gpu-webgpu` and ships
# in the scripts directory with the Dawn library, appending `data = "glia_py.data"`
# here in its checkout (a fixed `data` key fails every build without the directory,
# the sdist's among them, which therefore embeds on the CPU, fallback no_worker).
features = ["pyo3/extension-module", "embed"]
