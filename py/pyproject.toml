[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "glia-py"
version = "0.5.1"
description = "glia, the Rust cross-language code-graph engine (pyo3): parses, builds, and stores code graphs. The engine behind mcp-repo-graph."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    {name = "James Chahwan"},
]
keywords = ["mcp", "llm", "codebase", "graph", "rust", "pyo3"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/James-Chahwan/glia"
Repository = "https://github.com/James-Chahwan/glia"
Issues = "https://github.com/James-Chahwan/glia/issues"

[tool.maturin]
# Must equal py/Cargo.toml's [lib] name and the #[pymodule] fn in py/src/lib.rs
# (pyo3 exports PyInit_<name>); the three move together.
module-name = "glia_py"
features = ["pyo3/extension-module"]
