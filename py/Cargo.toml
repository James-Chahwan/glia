[package]
name = "glia-py"
version.workspace = true
edition = "2024"
publish = false
description = "Native Rust engine for mcp-repo-graph — parses, builds, and stores code graphs."
license-file = "../LICENSE"
repository = "https://github.com/James-Chahwan/glia"
readme = "README.md"

[lib]
name = "repo_graph_py"
crate-type = ["cdylib"]

[dependencies]
# `multiple-pymethods`: one `#[pymethods] impl PyGraph` per primitive module.
# NO `extension-module` here: its registrations would leave the unit-test
# executable with undefined libpython symbols. Wheels get it from
# pyproject.toml's `[tool.maturin] features` (see src/lib.rs, "Link note").
pyo3 = { version = "0.28", features = ["abi3-py311", "multiple-pymethods"] }
glia-core = { path = "../core" }
glia-code-domain = { path = "../code-domain" }
glia-graph = { path = "../graph" }
glia-engine = { path = "../engine" }
glia-projection-text = { path = "../projection-text" }
glia-activation = { path = "../activation" }
glia-store = { path = "../store" }
# The snapshot writers behind `history_sync` (LF.5d): runs the local git, no
# network I/O (unlike doc-sources, which py deliberately does not depend on).
# The build never calls it; the wrapper syncs before generate().
glia-snapshots = { path = "../snapshots" }
# Parse POSITION cell JSON + build answer records for the P3 primitives
# (blast_radius/resolve). Already in the tree via the engine.
serde_json = "1"
# Self-registration of module functions (`registry::ModuleFns`): each module
# submits its own `register`, so adding a primitive never edits lib.rs. The
# same crate backs pyo3's `multiple-pymethods`, so it adds no new class of
# dependency.
inventory = "0.3"

[dev-dependencies]
# `tests/api_surface.rs` (LG.6a) parses every `src/**/*.rs` and pins the
# Python-visible surface. Source-level only: the test binary never links this
# cdylib. All three crates (and syn's `full` + `visit`) are already in the
# workspace build via pyo3-macros-backend / serde_derive — no new download.
syn = { version = "2", features = ["full", "visit"] }
quote = "1"
proc-macro2 = "1"
