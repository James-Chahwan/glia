[package]
name = "shop"
version = "0.1.0"
edition = "2021"

[features]
cli = []

[dependencies]
anyhow = "1"

[dependencies.serde]
version = "1"
features = ["derive"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies.winapi]
version = "0.3"
features = ["winuser"]

[dev-dependencies]
tempfile = "3"

[[test]]
name = "smoke"
path = "tests/smoke.rs"
harness = false

[[bench]]
name = "speed"
path = "benches/speed.rs"
harness = false

[[bin]]
name = "shopd"
path = "src/main.rs"
required-features = ["cli"]

[[example]]
name = "demo"
path = "examples/demo.rs"

[build-dependencies]
cc = "1"
