[package]
name = "glia-rules"
version.workspace = true
edition = "2024"
# FH.18: tests/*.rs compile into one target (build.rs); see the [[test]] tables below.
autotests = false
publish = false
description = "Domain-free Datalog rule evaluator: a string-named rule IR, one lexer shared by the Datalog surface and the GQL read subset, analysis, a planner, levelled semi-naive evaluation over sorted batches, reaches / scc builtins over activation::algo, provenance and explain, grouped aggregates and magic sets; its fact seam is FactSource: GraphSource. Query-time: no stored derived edges."

[dependencies]
# Node / edge ids and the domain-free graph primitives the fact seam reads.
glia-core = { path = "../core" }
# GraphSource (the fact seam's supertrait) and the algo walks (reach, cycles).
glia-activation = { path = "../activation" }

# FH.18: one integration-test binary. build.rs lists every tests/*.rs that is not kept as
# its own target into `rules_tests`; each kept file is on build.rs's KEEP list too.
[[test]]
name = "rules_tests"
path = "tests/all.rs"

[[test]]
name = "cost"
path = "tests/cost.rs"

[[test]]
name = "toy"
path = "tests/toy.rs"
