[package]
name = "glia-graph"
version.workspace = true
edition = "2024"
# FH.18: tests/*.rs compile into one target (build.rs); see the [[test]] tables below.
autotests = false
publish = false

[dependencies]
glia-core = { path = "../core" }
glia-code-domain = { path = "../code-domain" }
glia-code-extractors = { path = "../parsers/code/extractors" }
glia-activation = { path = "../activation" }
thiserror = "2"

[dev-dependencies]
glia-parser-python = { path = "../parsers/code/python" }
glia-parser-go = { path = "../parsers/code/go" }
glia-parser-typescript = { path = "../parsers/code/typescript" }

# FH.18: one integration-test binary. build.rs lists every tests/*.rs that is not kept as
# its own target into `graph_tests`; each kept file is on build.rs's KEEP list too.
[[test]]
name = "graph_tests"
path = "tests/all.rs"
