[package]
name = "glia-engine"
version.workspace = true
edition = "2024"
publish = false
description = "Pure-Rust orchestration: walk a repo, run language parsers + cross-cutting extractors, build per-lang graphs, merge, run cross-graph resolvers. Consumed by the pyo3 wrapper (`glia-py`) and the `glia` CLI."

[dependencies]
# Build identity (RELEASE + PARSER_STAMP) for the parse-cache accept check.
# Leaf crate with no deps of its own, so this costs nothing in the build DAG.
glia-stamp = { path = "../stamp" }
glia-core = { path = "../core" }
glia-code-domain = { path = "../code-domain" }
glia-graph = { path = "../graph" }
# Direction enum for the P3 resolve/blast answer-shaping (activation config).
glia-activation = { path = "../activation" }
glia-code-extractors = { path = "../parsers/code/extractors" }
glia-parser-python = { path = "../parsers/code/python" }
glia-parser-go = { path = "../parsers/code/go" }
glia-parser-typescript = { path = "../parsers/code/typescript" }
glia-parser-rust = { path = "../parsers/code/rust" }
glia-parser-java = { path = "../parsers/code/java" }
glia-parser-kotlin = { path = "../parsers/code/kotlin" }
glia-parser-csharp = { path = "../parsers/code/csharp" }
glia-parser-ruby = { path = "../parsers/code/ruby" }
glia-parser-php = { path = "../parsers/code/php" }
glia-parser-swift = { path = "../parsers/code/swift" }
glia-parser-c-cpp = { path = "../parsers/code/c_cpp" }
glia-parser-scala = { path = "../parsers/code/scala" }
glia-parser-clojure = { path = "../parsers/code/clojure" }
glia-parser-dart = { path = "../parsers/code/dart" }
glia-parser-elixir = { path = "../parsers/code/elixir" }
glia-parser-solidity = { path = "../parsers/code/solidity" }
glia-parser-terraform = { path = "../parsers/code/terraform" }
glia-parser-react = { path = "../parsers/code/react" }
glia-parser-angular = { path = "../parsers/code/angular" }
glia-parser-vue = { path = "../parsers/code/vue" }
# WP-D incremental parse cache: hash sources (xxhash64, same primitive as the
# store) + (de)serialize cached FileParses (bincode — transient sidecar).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
twox-hash = { version = "2", default-features = false, features = ["xxhash64"] }
# The one persist / load module (`persist`, LC.7) that py and cli share, so
# neither calls the store for a layout. One-way: the store depends on core,
# code-domain, graph and stamp, never on the engine, so there is no cycle.
glia-store = { path = "../store" }
# LG.1a: the per-file route / parse / extract runs on the engine's own rayon
# pool (`parallel`): order-preserving indexed collect, work stealing over
# skewed file sizes, a worker stack size we set. Its crossbeam deps were
# already in the lock through `ignore`.
rayon = "1"
# 0.5.1 dependencies, added together by C0.7 so Cargo.lock and PARSER_STAMP move
# once; each owner packet only `use`s its crate.
# CC.4b: the fidelity ladder (`pack`) renders through the dense-text projection.
# One-way: projection-text depends on core, code-domain, graph and activation,
# never on the engine; its `research` feature stays off.
glia-projection-text = { path = "../projection-text" }
# CD.7a: the parse-cache sidecar frame. Block API only (no frame format), and the
# safe-* / checked-decode features keep it free of unsafe on untrusted bytes.
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
# CE.2a: the content-addressed shared-cache keys. `pure` compiles no C or
# assembly, so the glia-py wheel matrix needs no assembler.
blake3 = { version = "1", features = ["pure"] }
# CE.3b: the format-preserving overlay writer. The same 0.22 line toml's parser
# already locks (code-domain); `display` adds toml_write.
toml_edit = { version = "0.22", default-features = false, features = ["parse", "display"] }

[dev-dependencies]
tempfile = "3"
