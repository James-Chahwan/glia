# The `glia-cli` PyPI package: the `glia` binary as a wheel (maturin bindings = "bin"), so
# `uvx --from glia-cli glia find <repo> X --json` and `pipx install glia-cli` need no Rust
# toolchain (FE.5). No Python module ships: the wheel's only payload is the executable.
# The version is cli/Cargo.toml's (`version.workspace = true`), read by maturin, so the
# release bump touches only the workspace Cargo.toml. scripts/check-cli-wheel.sh builds the
# wheel and the sdist from this file and installs both into fresh venvs.
[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "glia-cli"
dynamic = ["version"]
description = "glia, the cross-language code-graph engine, as a command-line tool: find, blast-radius, trace, review and more over one graph of your repo."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [
    {name = "James Chahwan"},
]
keywords = ["code-graph", "cli", "static-analysis", "llm", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Rust",
    "Topic :: Software Development",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/James-Chahwan/glia"
Repository = "https://github.com/James-Chahwan/glia"
Issues = "https://github.com/James-Chahwan/glia/issues"

[tool.maturin]
# A bin package: maturin compiles cli/Cargo.toml's [[bin]] `glia` and puts it in the
# wheel's scripts. No `module-name` (there is no Python module).
bindings = "bin"
strip = true
# FB.14: the wheel's `glia` carries the CPU embedding path only (`embed`, no
# `gpu-webgpu`), so it links no Dawn and starts on every glibc the manylinux tag
# promises (the Dawn prebuilt needs glibc >= 2.38). The GPU runs in glia-embed's
# `glia-embed-worker`, which the wheels workflow builds with `gpu-webgpu` and ships
# beside `glia` in the scripts directory with the Dawn library, appending
# `data = "glia_cli.data"` here in its checkout (a fixed `data` key fails every build
# without the directory, the sdist's among them, which therefore embeds on the CPU).
# `glia` finds the worker beside itself (cmd/inputs/embed.rs); without one it embeds
# on the CPU, fallback no_worker / not_built.
no-default-features = true
features = ["embed"]
