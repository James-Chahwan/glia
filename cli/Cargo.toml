[package]
name = "glia-cli"
version.workspace = true
edition = "2024"
# FH.18: tests/*.rs compile into one target (build.rs); see the [[test]] tables below.
autotests = false
publish = false
description = "glia CLI — analyze a repo, query impact reachability, merge multiple .gmap-style scans into a cross-service graph."

[[bin]]
name = "glia"
path = "src/main.rs"

[dependencies]
glia-engine = { path = "../engine" }
glia-graph = { path = "../graph" }
# algo::reach for `glia impact`'s walk (LD.15b).
glia-activation = { path = "../activation" }
glia-store = { path = "../store" }
glia-core = { path = "../core" }
glia-code-domain = { path = "../code-domain" }
# Tier-4 doc adapters (Confluence REST + snapshot). Network I/O lives here, not
# in the engine — the CLI drives `docs sync`/`docs push`; `build` stays offline.
glia-doc-sources = { path = "../doc-sources" }
# The history snapshot writer (`glia history sync`, LF.5d): runs the local git
# and writes <repo>/.glia/history-snapshot/. Like docs sync, the snapshot step
# is a CLI command; `build` never syncs and stays offline.
glia-snapshots = { path = "../snapshots" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
# 0.5.1 dependencies, added by C0.7 with the engine's so Cargo.lock moves once.
# The shared-cache transport is CLI-only: no HTTP crate enters the engine or the
# glia-py wheel.
# CE.2c: the cache object MAC; the same blake3 package the engine locks for its
# content-addressed keys (CE.2a). `pure` compiles no C or assembly.
blake3 = { version = "1", features = ["pure"] }
# CE.2e: the https store transport. Default features, as doc-sources; already
# locked through glia-doc-sources.
ureq = "2"
# 0.5.4 (F0.2): `glia embed` (FB.*). The CLI embeds by default through its
# `embed` feature; `--no-default-features` builds the lean binary without ORT.
glia-embed = { path = "../embed" }

[features]
default = ["embed", "gpu-webgpu"]
# bge-small through ONNX Runtime's CPU provider, in-process (FB.1, FB.5b).
embed = ["glia-embed/fastembed"]
# FB.14: bge-small on the GPU by default (ORT's WebGPU provider, Dawn), its
# session in this binary's hidden `glia embed-worker` child. The binary then
# links libwebgpu_dawn (beside it, build.rs's rpath), whose prebuilt needs
# glibc >= 2.38: on an older glibc build `--no-default-features --features
# embed`. On a target ORT ships no WebGPU build for (aarch64 Linux) the
# provider is absent and the CPU runs; on x86_64 macOS there is no ORT at all
# (INTEL-MAC-NO-EMBED). The glia-cli wheel builds `embed` only and ships
# glia-embed's `glia-embed-worker` + Dawn beside `glia` (pyproject.toml).
gpu-webgpu = ["embed", "glia-embed/gpu-webgpu"]
# The CUDA provider, opt-in only (GLIA_EMBED_DEVICE=cuda; never a published
# wheel): needs the CUDA 13 runtime and cuDNN 9 on the library path.
gpu-cuda = ["embed", "glia-embed/gpu-cuda"]

# FH.18: one integration-test binary. build.rs lists every tests/*.rs that is not kept as
# its own target into `cli_tests`; each kept file is on build.rs's KEEP list too.
[[test]]
name = "cli_tests"
path = "tests/all.rs"

[[test]]
name = "readme_surface"
path = "tests/readme_surface.rs"

[[test]]
name = "skill_surface"
path = "tests/skill_surface.rs"
