[package]
name = "glia-cli"
version.workspace = true
edition = "2024"
publish = false
description = "glia CLI — analyze a repo, query impact reachability, merge multiple .gmap-style scans into a cross-service graph."

[[bin]]
name = "glia"
path = "src/main.rs"

[dependencies]
glia-engine = { path = "../engine" }
glia-graph = { path = "../graph" }
# algo::reach for `glia impact`'s walk (LD.15b).
glia-activation = { path = "../activation" }
glia-store = { path = "../store" }
glia-core = { path = "../core" }
glia-code-domain = { path = "../code-domain" }
# Tier-4 doc adapters (Confluence REST + snapshot). Network I/O lives here, not
# in the engine — the CLI drives `docs sync`/`docs push`; `build` stays offline.
glia-doc-sources = { path = "../doc-sources" }
# The history snapshot writer (`glia history sync`, LF.5d): runs the local git
# and writes <repo>/.glia/history-snapshot/. Like docs sync, the snapshot step
# is a CLI command; `build` never syncs and stays offline.
glia-snapshots = { path = "../snapshots" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
# 0.5.1 dependencies, added by C0.7 with the engine's so Cargo.lock moves once.
# The shared-cache transport is CLI-only: no HTTP crate enters the engine or the
# glia-py wheel.
# CE.2c: the cache object MAC; the same blake3 package the engine locks for its
# content-addressed keys (CE.2a). `pure` compiles no C or assembly.
blake3 = { version = "1", features = ["pure"] }
# CE.2e: the https store transport. Default features, as doc-sources; already
# locked through glia-doc-sources.
ureq = "2"
