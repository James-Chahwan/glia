[package]
name = "glia-store"
version.workspace = true
edition = "2024"
# FH.18: tests/*.rs compile into one target (build.rs); see the [[test]] tables below.
autotests = false
publish = false

[dependencies]
glia-core = { path = "../core" }
glia-code-domain = { path = "../code-domain" }
glia-graph = { path = "../graph" }
glia-stamp = { path = "../stamp" }
rkyv = { version = "0.8", features = ["bytecheck"] }
memmap2 = "0.9"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
twox-hash = { version = "2", default-features = false, features = ["xxhash64"] }

[dev-dependencies]
tempfile = "3"
glia-parser-go = { path = "../parsers/code/go" }
glia-parser-typescript = { path = "../parsers/code/typescript" }
glia-projection-text = { path = "../projection-text" }

# FH.18: one integration-test binary. build.rs lists every tests/*.rs that is not kept as
# its own target into `store_tests`; each kept file is on build.rs's KEEP list too.
[[test]]
name = "store_tests"
path = "tests/all.rs"
