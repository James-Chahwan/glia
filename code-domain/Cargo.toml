[package]
name = "repo-graph-code-domain"
version = "0.4.3"
edition = "2024"
publish = false

[dependencies]
repo-graph-core = { path = "../core" }
# The domain-profile SHAPE (`activation::profile`, LD.14a): code-domain fills
# it with `profile::CODE_TABLES`. No cycle: activation depends on core only.
repo-graph-activation = { path = "../activation" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rkyv = { version = "0.8", features = ["bytecheck"] }
ignore = "0.4"
# `.glia/overlay.toml` loader (LF.2a). `parse` only: the `display` writer
# (toml_edit's serializer) is never compiled.
toml = { version = "0.8", default-features = false, features = ["parse"] }
# `snapshots::data_hash` (LF.5a): xxhash64 over a snapshot's data files, the
# same hash and hex form the store uses for shard and input fingerprints.
twox-hash = { version = "2", default-features = false, features = ["xxhash64"] }
# `.glia/vectors.jsonl` rows carry their bytes as standard base64 (LF.1a,
# `external_inputs`). Already in the lock as a transitive dep.
base64 = "0.22"
