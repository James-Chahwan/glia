[package]
name = "repo-graph-code-domain"
version = "0.4.3"
edition = "2024"
publish = false

[dependencies]
repo-graph-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rkyv = { version = "0.8", features = ["bytecheck"] }
ignore = "0.4"
# `.glia/overlay.toml` loader (LF.2a). `parse` only: the `display` writer
# (toml_edit's serializer) is never compiled.
toml = { version = "0.8", default-features = false, features = ["parse"] }
